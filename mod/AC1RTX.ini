[Debug]
; DXVK HUD items (DXVK_HUD syntax), empty disables. scale=3 = three times the default size.
FpsHud=fps,frametimes,scale=3
; Virtual-key code that saves a PNG of the game window (80 = P; 0 disables).
ScreenshotKey=80
; Folder for those PNGs (default: scripts\screens next to the ASI).
ScreenshotDir=C:\Users\manu\Desktop\MOD\AC1-RTX\tests\screens
; Pixel shaders outside the specular census are saved here for offline analysis.
ShaderDumpDir=C:\Users\manu\Desktop\MOD\AC1-RTX\tests\shaders

[Geometry]
; Submit DX9StaticMesh geometry (decoded from the game's vertex/index buffers) through the Remix API.
StaticMeshes=1

[Lights]
; Engine omni/spot/directional lights -> Remix lights; engine SunLight -> Numos sun angles (rtx.skyMode = 1).
; Lights that share no light channel with world geometry (character-only lights) are not exported.
Enable=1
; Calibration values (not engine data): Remix sphere radius in metres for omni/spot lights, and the global
; engine colour -> Remix radiance factor.
SphereRadius=0.1
; 0.3 = -70 % (user 2026-10-03: game lights too strong; the sun is the Numos sky, not scaled)
RadianceScale=0.3

[Visibility]
; Keep objects/lights outside the camera frustum and small/medium objects beyond their cull distances in the draw lists.
AntiCulling=1
; Every LOD selector draws the LOD the engine picks at distance 0, without LOD cross-fades.
ForceMaxLod=1
; Off-screen objects (reflections/GI/shadows only) kept within these eye distances (metres) per engine size class,
; drawn at their coarsest LOD. Small objects are never kept off-screen. Tuning values, not game data.
OffscreenRadiusLarge=150
OffscreenRadiusMedium=40
OffscreenRadiusSmall=0
; On-screen small/medium object cull distances = engine's x this (0 = no limit).
CullDistanceScale=2.0
; On-screen LOD: most detailed within MaxLodRadius metres, beyond it engine LOD at distance x LodDistanceScale.
MaxLodRadius=30
LodDistanceScale=0.5


[HUD]
; Hook the engine's end-of-frame 2D overlay dispatcher (FUN_009ED5F0): submit the frame's world there and mark it as
; the Remix injection point, so the game's HUD/menus are rasterized on top of the ray-traced image.
; Needs rtx.enableApiInjectionMarker = True and the rebuilt Remix runtime + bridge.
Enable=1


[PBR]
; Offline PBR materials (ComfyUI workflow concept_flussoPBR_AC1remix, tools\pbr_batch.py), keyed by the content hash
; of the engine albedo. Dump exports every albedo that can take PBR maps (terrain, opaque, alpha-tested and
; alpha-blended surfaces, alpha kept) to <Folder>\dump; Enable uses the maps
; found in <Folder>\maps (albedo, normal, roughness, metallic, height + POM) instead of the engine textures.
Enable=1
Dump=1
Folder=C:\Users\manu\Desktop\MOD\AC1-RTX\pbr
; Maps sub-folder = workflow upscale factor (x4, x2).
Variant=x4
; Writes vegetation meshes (OBJ), textures and placements to <Folder>\vegetation (clutter and
; alpha-tested surfaces), to rebuild the vegetation later.
ExportVegetation=1
; Test: height/POM also on the terrain layer overlays (alpha-blended decals).
LayerPom=1
